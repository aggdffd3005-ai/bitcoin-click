<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bitcoin Click & Earn</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #1e003b, #0d0020);
      color: white;
      font-family: sans-serif;
      min-height: 100vh;
    }
    .container { max-width: 500px; margin: 0 auto; }
    #clickArea {
      width: 200px;
      height: 200px;
      margin: 30px auto;
      background: radial-gradient(circle, gold, #ff8c00);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      user-select: none;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>₿ Bitcoin Click & Earn</h1>
    
    <!-- دکمه اتصال کیف پول -->
    <div id="walletButton"></div>
    
    <!-- بازی بعد از اتصال -->
    <div id="game" class="hidden">
      <div>امتیاز: <span id="score">0</span></div>
      <div id="clickArea">CLICK!</div>
      <p style="font-size:12px;color:#aaa;">
        هر 1000 امتیاز = 0.1 TON<br>
        10% به آدرس مدیر واریز می‌شود.
      </p>
    </div>

    <div id="owner" style="margin-top:30px;font-size:12px;color:#777;">
      آدرس دریافت‌کننده:<br>
      UQD2v9oV3qqqA608kruzesWyo3f_coVUAC4xDkTrE7YlX43a
    </div>
  </div>

  <script>
    const TON_CONNECT_CDNS = [
      'https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js',
      'https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js',
      'https://cdn.jsdelivr.net/npm/@tonconnect/ui@2/dist/tonconnect-ui.min.js',
      'https://cdn.skypack.dev/@tonconnect/ui'
    ];

    function loadExternalScript(url, timeoutMs = 6000) {
      return new Promise((resolve, reject) => {
        if (typeof window.TonConnectUI !== 'undefined') {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.defer = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('failed to load ' + url));
        document.head.appendChild(script);
        setTimeout(() => reject(new Error('timeout ' + url)), timeoutMs);
      });
    }

    async function ensureTonConnectUILoaded() {
      if (typeof window.TonConnectUI !== 'undefined') return;
      for (const url of TON_CONNECT_CDNS) {
        try {
          await loadExternalScript(url, 6000);
          if (typeof window.TonConnectUI !== 'undefined') return;
        } catch (_) {
          // try next CDN
        }
      }
      throw new Error('TonConnectUI not available from CDNs');
    }

    function showWalletFallback(message) {
      const root = document.getElementById('walletButton');
      root.innerHTML = '<button disabled style="padding:10px 16px;border-radius:10px;background:#444;color:#bbb;border:0;cursor:not-allowed">اتصال کیف پول در دسترس نیست</button>' +
        '<div style="margin-top:8px;font-size:12px;color:#999;">' + message + '</div>';
    }

    function setupApp() {
      const manifestUrl = './tonconnect-manifest.json';
      let tonConnectUI;
      try {
        tonConnectUI = new window.TonConnectUI.TonConnectUI({
          manifestUrl: manifestUrl,
          buttonRootId: 'walletButton'
        });
      } catch (err) {
        showWalletFallback('لطفاً اینترنت پایدار یا VPN را امتحان کنید.');
      }

      let score = localStorage.getItem('score') || 0;
      document.getElementById('score').innerText = score;

      if (tonConnectUI) {
        tonConnectUI.onStatusChange(wallet => {
          if (wallet) {
            document.getElementById('game').classList.remove('hidden');
          }
        });
      }

      document.getElementById('clickArea').addEventListener('touchstart', handleMultiTouch, { passive: false });
      document.getElementById('clickArea').addEventListener('mousedown', () => handleClick(1));

      let lastClick = 0;
      function handleMultiTouch(e) {
        e.preventDefault();
        const touches = Math.min(e.touches.length, 5);
        handleClick(touches);
      }

      function handleClick(touches) {
        const now = Date.now();
        if (now - lastClick < 500) {
          alert("لطفاً کمی صبر کنید!");
          return;
        }

        score = parseInt(score, 10) + touches;
        localStorage.setItem('score', score);
        document.getElementById('score').innerText = score;
        lastClick = now;

        if (score >= 1000) {
          alert("🎉 1000 امتیاز جمع کردی! برای دریافت 0.1 TON، باید از طریق سرور درخواست بدی.");
        }
      }
    }

    async function initApp() {
      try {
        await ensureTonConnectUILoaded();
      } catch (err) {
        showWalletFallback('خطا در بارگذاری اتصال تون. اگر ممکن است VPN را روشن کنید.');
      } finally {
        setupApp();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
